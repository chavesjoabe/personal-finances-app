# Quarkus Application Properties

# MongoDB Configuration
quarkus.mongodb.connection-string=${MONGODB_CONNECTION_STRING:mongodb://localhost:27017}
quarkus.mongodb.database=${MONGODB_DATABASE:personal-finances}

# CORS Configuration for Frontend integration
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# JWT Configuration
jwt.secret=${JWT_SECRET:personal-finances-super-secret-jwt-key-2026-very-secure-256-bits-minimum}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# OpenAPI and Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# HTTP Port (allows custom port via PORT or QUARKUS_HTTP_PORT)
quarkus.http.port=${PORT:${QUARKUS_HTTP_PORT:8080}}
# Package as uber-jar for standalone deployment
quarkus.package.jar.type=uber-jar

# Test Profile Configuration
%test.quarkus.http.port=8081
%test.quarkus.mongodb.devservices.enabled=false
%test.jwt.expiration-hours=24
%test.jwt.secret=personal-finances-super-secret-jwt-key-2026-very-secure-256-bits-minimum
